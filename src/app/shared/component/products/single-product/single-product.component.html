
<div class="row" *ngIf="productObj">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header">Product Name:{{productObj.pName}}</div>
            <div class="card-body">
                <p>Status:{{productObj.pStatus}}</p>
                <p>Can Return : {{productObj.canReturn ? "Yes" : "No"}}</p>
            </div>
            <div class="card-footer d-flex justify-content-between">
                <button routerLink="edit" queryParamsHandling="preserve" mat-raised-button color="primary">Edit</button>
                <button (click)="onRemove()" mat-raised-button color="warn">Remove</button>
            </div>
        </div>
    </div>
</div>
