<nav class="app-nav navbar navbar-expand-md navbar-dark">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" routerLink="/home" (click)="closeMenu()">
            <mat-icon class="mr-2">dashboard</mat-icon>
            Admin Panel
        </a>

        <button class="navbar-toggler" type="button" aria-label="Toggle navigation"
            [attr.aria-expanded]="isMenuOpen" (click)="toggleMenu()">
            <mat-icon>{{ isMenuOpen ? 'close' : 'menu' }}</mat-icon>
        </button>

        <div class="collapse navbar-collapse" [class.show]="isMenuOpen">
            <ul class="navbar-nav ml-auto">
                <li class="nav-item" *ngFor="let link of links">
                    <a class="nav-link" [routerLink]="link.path" routerLinkActive="active" (click)="closeMenu()">
                        <mat-icon>{{ link.icon }}</mat-icon>
                        <span>{{ link.label }}</span>
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container page-content">
    <router-outlet></router-outlet>
</main>
